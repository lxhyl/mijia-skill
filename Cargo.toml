[package]
name = "mijia-cli"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Read and control Xiaomi Mi Home (Mijia) devices through the Xiaomi cloud MiOT API, built for AI agents"
license = "MIT"
repository = "https://github.com/lxhyl/mijia-skill"
homepage = "https://github.com/lxhyl/mijia-skill"
readme = "README.md"
keywords = ["xiaomi", "mijia", "miot", "smart-home", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "mijia"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
